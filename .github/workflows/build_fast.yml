name: Build Nuitka Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka pyside6 pyside6-addons streamlit pillow matplotlib numpy

    - name: Compile with Nuitka
      run: |
        python -m nuitka `
          --standalone `
          --onefile `
          --enable-plugin=pyside6 `
          --enable-plugin=anti-bloat `
          --include-package=streamlit `
          --include-data-file=app.py=app.py `
          --include-data-file=image_01.png=image_01.png `
          --include-data-file=image_02.png=image_02.png `
          --assume-yes-for-downloads `
          --jobs=4 `
          main.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TyreAnalysis-Executable
        path: main.exe
